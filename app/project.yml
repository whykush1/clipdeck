name: Clipdeck
options:
  bundleIdPrefix: dev.pythogen
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 1.16.1
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.2
  Aptabase:
    url: https://github.com/aptabase/aptabase-swift
    from: 0.3.0
targets:
  Clipdeck:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      ARCHS: arm64
      ONLY_ACTIVE_ARCH: NO
    sources: [Sources]
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
      - package: Aptabase
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
        CFBundleShortVersionString: "2.4"
        CFBundleVersion: "5"
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
        SUPublicEDKey: "aIvyx+0/GNhurGtEX6oHwmZQ0Ti6StFBAM3QaeZJFtU="
        SUFeedURL: "https://raw.githubusercontent.com/whykush1/clipdeck/main/appcast.xml"
